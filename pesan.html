<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=5.0">
<meta name="theme-color" content="#1A0E08">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="format-detection" content="telephone=no">
<title>Pesan Online — Warung Cakrawala Sego Sambel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;600;800&display=swap">
<style>
:root{
  --primary:#E63946; --primary-600:#C42A38; --primary-700:#A01F2C; --primary-soft:rgba(230,57,70,.14);
  --accent:#F4A300; --accent-600:#D98F00; --accent-soft:rgba(244,163,0,.15);
  --success:#22C55E; --success-600:#16A34A; --success-soft:rgba(34,197,94,.14);
  --danger:#EF4444; --warning:#F59E0B; --info:#3B82F6;
  --purple:#A855F7; --purple-soft:rgba(168,85,247,.14);
  --bg:#0F0805;
  --surface:rgba(255,240,225,.045);
  --surface-2:rgba(255,240,225,.075);
  --surface-3:rgba(255,240,225,.115);
  --border:rgba(255,220,180,.10);
  --border-strong:rgba(255,220,180,.22);
  --text:#FFF6EC; --text-2:#D4BFA9; --text-3:#A89078;
  --r-xs:8px; --r-sm:12px; --r:16px; --r-lg:20px; --r-xl:24px; --r-full:9999px;
  --shadow-sm:0 2px 8px rgba(0,0,0,.35),0 1px 2px rgba(0,0,0,.25);
  --shadow:0 8px 24px rgba(0,0,0,.42),0 2px 6px rgba(0,0,0,.28);
  --shadow-lg:0 22px 60px rgba(0,0,0,.55),0 6px 18px rgba(0,0,0,.35);
  --ease-spring:cubic-bezier(0.34,1.56,0.64,1);
  --ease-smooth:cubic-bezier(0.4,0,0.2,1);
  --t-fast:150ms; --t:220ms; --t-slow:360ms;
  --font:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --font-mono:'JetBrains Mono','Courier New',monospace;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{
  font-family:var(--font);background:var(--bg);color:var(--text);
  min-height:100dvh;padding:16px 16px 140px;overflow-x:hidden;line-height:1.5;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  overscroll-behavior-y:none;
}
body::after{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:1;opacity:.035;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
  mix-blend-mode:overlay;
}
body::before{
  content:'';position:fixed;border-radius:50%;filter:blur(120px);opacity:.30;pointer-events:none;z-index:-1;
  width:440px;height:440px;background:radial-gradient(circle,#E63946 0%,transparent 70%);
  top:-160px;left:-140px;animation:float1 22s ease-in-out infinite;
}
.bg-blob-2{
  position:fixed;border-radius:50%;filter:blur(120px);opacity:.26;pointer-events:none;z-index:-1;
  width:480px;height:480px;background:radial-gradient(circle,#F4A300 0%,transparent 70%);
  bottom:-200px;right:-180px;animation:float2 26s ease-in-out infinite;
}
@keyframes float1{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(50px,30px) scale(1.08)}}
@keyframes float2{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(-40px,-30px) scale(1.06)}}
img,svg{display:block;max-width:100%}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:none;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-thumb{background:rgba(255,220,180,.14);border-radius:3px}

.app{max-width:640px;margin:0 auto;position:relative;z-index:2}

.app-header{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:16px 18px;margin-bottom:18px;border-radius:var(--r-lg);
  background:linear-gradient(135deg,rgba(230,57,70,.16),rgba(244,163,0,.10)),var(--surface);
  border:1px solid var(--border);
  backdrop-filter:blur(20px) saturate(160%);-webkit-backdrop-filter:blur(20px) saturate(160%);
  box-shadow:var(--shadow);
}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand-logo{
  width:46px;height:46px;border-radius:14px;display:grid;place-items:center;flex-shrink:0;
  background:linear-gradient(135deg,var(--primary),var(--primary-700));
  font-size:24px;box-shadow:0 8px 22px rgba(230,57,70,.45);
}
.brand-text{min-width:0}
.brand-text h1{font-size:15px;font-weight:800;letter-spacing:-.2px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand-text h1 span{background:linear-gradient(90deg,var(--accent),var(--primary));-webkit-background-clip:text;background-clip:text;color:transparent}
.brand-text p{font-size:10.5px;color:var(--text-3);font-weight:500;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.status-pill{
  display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:var(--r-full);
  background:var(--success-soft);border:1px solid rgba(34,197,94,.32);color:#86EFAC;
  font-size:11px;font-weight:700;flex-shrink:0;
}
.status-pill .dot{width:7px;height:7px;border-radius:50%;background:var(--success);box-shadow:0 0 0 3px rgba(34,197,94,.22);animation:pulseDot 2s ease-in-out infinite}
@keyframes pulseDot{0%,100%{opacity:.7;transform:scale(1)}50%{opacity:1;transform:scale(1.3)}}

.search-wrap{position:relative;margin-bottom:14px}
.search-wrap .search-icon{position:absolute;left:16px;top:50%;transform:translateY(-50%);color:var(--text-3);pointer-events:none}
.search-input{
  width:100%;padding:13px 44px 13px 44px;border-radius:var(--r-full);
  background:var(--surface-2);border:1.5px solid var(--border);color:var(--text);
  font-size:13.5px;font-weight:600;transition:all var(--t);
}
.search-input:focus{outline:none;border-color:rgba(244,163,0,.55);background:var(--surface-3);box-shadow:0 0 0 4px rgba(244,163,0,.16)}
.search-input::placeholder{color:var(--text-3);font-weight:500}
.search-clear{
  position:absolute;right:10px;top:50%;transform:translateY(-50%);
  width:28px;height:28px;border-radius:50%;display:grid;place-items:center;
  color:var(--text-3);transition:all var(--t);
}
.search-clear:hover{background:var(--primary-soft);color:var(--primary)}

.chips-scroll{
  display:flex;gap:8px;overflow-x:auto;padding:4px 2px 12px;
  margin:0 -2px 8px;scrollbar-width:none;
  scroll-snap-type:x proximity;
  mask-image:linear-gradient(90deg,transparent 0,#000 8px,#000 calc(100% - 8px),transparent 100%);
}
.chips-scroll::-webkit-scrollbar{display:none}
.chip{
  position:relative;overflow:hidden;flex-shrink:0;
  display:inline-flex;align-items:center;gap:6px;padding:9px 15px;
  border-radius:var(--r-full);background:var(--surface-2);border:1px solid var(--border);
  color:var(--text-2);font-size:12.5px;font-weight:700;
  transition:all var(--t) var(--ease-spring);
  scroll-snap-align:start;
}
.chip:hover{background:var(--surface-3);color:var(--text);transform:translateY(-1px);border-color:rgba(244,163,0,.45)}
.chip.active{
  background:linear-gradient(135deg,#F4A300 0%,#E63946 100%);
  border-color:transparent;color:#fff;
  box-shadow:0 6px 22px rgba(244,163,0,.55),inset 0 1px 0 rgba(255,255,255,.35);
}
.chip .chip-emoji{font-size:14px;line-height:1;transition:transform var(--t) var(--ease-spring)}
.chip:hover .chip-emoji{transform:scale(1.15) rotate(-8deg)}
.chip .chip-count{
  font-size:10px;font-weight:800;padding:1px 7px;border-radius:var(--r-full);
  background:rgba(0,0,0,.22);color:inherit;margin-left:2px;
}
.chip.active .chip-count{background:rgba(255,255,255,.25);color:#fff}

.section-head{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  margin:16px 2px 12px;
}
.section-head h2{font-size:15px;font-weight:800;letter-spacing:-.2px;display:flex;align-items:center;gap:8px}
.section-head h2 .accent-bar{
  width:4px;height:18px;border-radius:2px;
  background:linear-gradient(180deg,var(--accent),var(--primary));
}
.section-head .count{font-size:11.5px;color:var(--text-3);font-weight:600}

.menu-grid{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));
  gap:12px;margin-bottom:16px;
}
@media (max-width:420px){.menu-grid{grid-template-columns:repeat(2,1fr);gap:10px}}

.menu-card{
  position:relative;display:flex;flex-direction:column;gap:8px;
  padding:16px 12px 12px;border-radius:var(--r);
  background:linear-gradient(160deg,var(--surface-2),var(--surface));
  border:1px solid var(--border);box-shadow:var(--shadow-sm);
  cursor:pointer;text-align:center;overflow:hidden;
  transition:transform var(--t) var(--ease-spring),box-shadow var(--t) var(--ease-smooth),border-color var(--t);
  animation:fadeUp 420ms var(--ease-spring) both;animation-delay:var(--delay,0ms);
}
.menu-card::before{
  content:'';position:absolute;inset:-1px;border-radius:inherit;padding:1px;
  background:linear-gradient(140deg,rgba(244,163,0,.9),rgba(230,57,70,.5) 45%,transparent 70%);
  -webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);
  -webkit-mask-composite:xor;mask-composite:exclude;
  pointer-events:none;opacity:0;transition:opacity var(--t);
}
.menu-card:hover::before{opacity:1}
.menu-card:hover{transform:translateY(-4px);border-color:rgba(244,163,0,.55);box-shadow:0 14px 36px rgba(0,0,0,.42),0 0 32px rgba(244,163,0,.28)}
.menu-card:active{transform:scale(.96)}
.card-emoji{
  width:56px;height:56px;margin:0 auto;border-radius:50%;display:grid;place-items:center;
  font-size:28px;background:radial-gradient(circle at 30% 30%,rgba(244,163,0,.24),rgba(230,57,70,.10) 60%,var(--surface));
  border:1px solid rgba(244,163,0,.24);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 4px 14px rgba(244,163,0,.10);
  transition:transform var(--t) var(--ease-spring),box-shadow var(--t);
}
.menu-card:hover .card-emoji{transform:scale(1.09) rotate(-4deg);box-shadow:inset 0 1px 0 rgba(255,255,255,.10),0 8px 22px rgba(244,163,0,.28)}
.menu-card h3{
  font-size:12.5px;font-weight:700;color:var(--text);line-height:1.3;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  min-height:2.4em;
}
.menu-card .price{
  font-size:13px;font-weight:800;
  background:linear-gradient(90deg,var(--accent),var(--primary));
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.menu-card .price.free{
  background:linear-gradient(90deg,#22C55E,#16A34A);
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.card-tag{
  position:absolute;top:9px;left:9px;font-size:9px;font-weight:800;
  text-transform:uppercase;letter-spacing:.5px;color:#FFD27A;
  padding:2px 7px;border-radius:var(--r-full);
  background:linear-gradient(135deg,rgba(244,163,0,.24),rgba(230,57,70,.18));
  border:1px solid rgba(244,163,0,.45);
}
.qty-badge{
  position:absolute;top:9px;right:9px;min-width:26px;height:26px;padding:0 7px;
  border-radius:var(--r-full);background:linear-gradient(135deg,var(--primary),var(--primary-700));
  color:#fff;font-size:11px;font-weight:800;display:grid;place-items:center;
  box-shadow:0 4px 12px rgba(230,57,70,.55);
  transform:scale(0);transition:transform var(--t) var(--ease-spring);
  pointer-events:none;
}
.qty-badge.show{transform:scale(1)}
.qty-badge.bounce{animation:badgePop 420ms var(--ease-spring)}
@keyframes badgePop{0%{transform:scale(0)}50%{transform:scale(1.4)}100%{transform:scale(1)}}
.btn-add{
  width:100%;padding:9px 12px;border-radius:10px;margin-top:4px;
  background:rgba(244,163,0,.16);color:var(--accent);
  font-weight:700;font-size:12px;
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  border:1px solid rgba(244,163,0,.35);
  transition:all var(--t) var(--ease-spring);
}
.btn-add:hover{background:linear-gradient(135deg,#F4A300,#E63946);color:#fff;border-color:transparent;box-shadow:0 8px 22px rgba(244,163,0,.55);transform:translateY(-1px)}

.menu-empty{
  grid-column:1/-1;text-align:center;padding:60px 20px;color:var(--text-3);
}
.menu-empty-icon{
  width:64px;height:64px;margin:0 auto 14px;border-radius:50%;
  display:grid;place-items:center;background:var(--surface-2);border:1px solid var(--border);
}
.menu-empty p{font-size:14px;font-weight:700;color:var(--text-2);margin-bottom:4px}
.menu-empty small{font-size:12px}

.bottom-bar{
  position:fixed;left:0;right:0;bottom:0;z-index:200;
  background:linear-gradient(180deg,rgba(30,18,9,.92),rgba(20,11,6,.98));
  border-top:1px solid var(--border-strong);
  backdrop-filter:blur(20px) saturate(160%);-webkit-backdrop-filter:blur(20px) saturate(160%);
  padding:12px 16px calc(12px + env(safe-area-inset-bottom));
  transform:translateY(0);transition:transform var(--t-slow) var(--ease-spring);
}
.bottom-bar.hidden{transform:translateY(120%)}
.bar-inner{
  max-width:640px;margin:0 auto;display:flex;align-items:center;gap:12px;
}
.bar-cart-btn{
  display:flex;align-items:center;gap:10px;flex:1;min-width:0;
  padding:10px 14px;border-radius:14px;
  background:var(--surface-2);border:1px solid var(--border);
  transition:all var(--t);
}
.bar-cart-btn:hover{background:var(--surface-3);border-color:var(--border-strong)}
.cart-icon-wrap{
  position:relative;width:40px;height:40px;border-radius:12px;
  display:grid;place-items:center;flex-shrink:0;
  background:linear-gradient(135deg,rgba(230,57,70,.22),rgba(244,163,0,.18));
  border:1px solid rgba(244,163,0,.3);color:var(--accent);
}
.cart-badge{
  position:absolute;top:-6px;right:-6px;min-width:20px;height:20px;padding:0 5px;
  border-radius:var(--r-full);background:linear-gradient(135deg,var(--primary),var(--primary-700));
  color:#fff;font-size:10.5px;font-weight:800;display:grid;place-items:center;
  box-shadow:0 3px 10px rgba(230,57,70,.55);
  transform:scale(0);transition:transform var(--t) var(--ease-spring);
}
.cart-badge.show{transform:scale(1)}
.cart-badge.bounce{animation:badgePop 420ms var(--ease-spring)}
.cart-info{text-align:left;min-width:0;overflow:hidden}
.cart-info small{display:block;font-size:10.5px;color:var(--text-3);font-weight:600}
.cart-info strong{
  display:block;font-size:15px;font-weight:800;
  background:linear-gradient(90deg,var(--accent),var(--primary));
  -webkit-background-clip:text;background-clip:text;color:transparent;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.btn-view-cart{
  padding:14px 22px;border-radius:14px;font-size:13.5px;font-weight:800;
  background:linear-gradient(135deg,var(--primary),var(--primary-600));
  color:#fff;box-shadow:0 8px 22px rgba(230,57,70,.4);
  display:inline-flex;align-items:center;gap:6px;flex-shrink:0;
  transition:transform var(--t) var(--ease-spring),box-shadow var(--t);
  white-space:nowrap;
}
.btn-view-cart:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 12px 28px rgba(230,57,70,.55)}
.btn-view-cart:active{transform:scale(.96)}
.btn-view-cart:disabled{opacity:.5;cursor:not-allowed}

.fly-emoji{
  position:fixed;z-index:9999;pointer-events:none;font-size:32px;line-height:1;
  transition:left 620ms cubic-bezier(.5,.05,.55,1),top 620ms cubic-bezier(.5,.05,.55,1),
             transform 620ms ease-in,opacity 620ms ease-in;
  filter:drop-shadow(0 4px 12px rgba(244,163,0,.6));
}

.sheet-overlay{
  position:fixed;inset:0;z-index:1000;
  background:rgba(8,3,2,.72);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  opacity:0;visibility:hidden;transition:opacity var(--t) var(--ease-smooth),visibility var(--t);
  display:flex;align-items:flex-end;justify-content:center;
}
.sheet-overlay.show{opacity:1;visibility:visible}
.sheet{
  width:100%;max-width:640px;max-height:92dvh;
  background:linear-gradient(170deg,#1E1209,#140B06);
  border-radius:24px 24px 0 0;border:1px solid var(--border-strong);border-bottom:none;
  box-shadow:var(--shadow-lg);overflow:hidden;
  display:flex;flex-direction:column;
  transform:translateY(100%);transition:transform var(--t-slow) var(--ease-spring);
}
.sheet-overlay.show .sheet{transform:translateY(0)}
.sheet-handle{
  width:44px;height:4px;border-radius:2px;background:var(--surface-3);
  margin:10px auto 2px;flex-shrink:0;
}
.sheet-head{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:14px 22px 16px;border-bottom:1px solid var(--border);flex-shrink:0;
}
.sheet-head h2{font-size:16px;font-weight:800;letter-spacing:-.2px;display:flex;align-items:center;gap:10px}
.sheet-head h2 .icon{color:var(--accent)}
.sheet-close{
  width:34px;height:34px;border-radius:50%;display:grid;place-items:center;
  background:var(--surface-2);color:var(--text-2);
  transition:all var(--t) var(--ease-spring);
}
.sheet-close:hover{background:var(--primary-soft);color:var(--primary);transform:rotate(90deg)}
.sheet-body{
  flex:1;overflow-y:auto;padding:16px 22px 22px;
  -webkit-overflow-scrolling:touch;
}
.sheet-body::-webkit-scrollbar{width:5px}
.sheet-foot{
  padding:16px 22px calc(18px + env(safe-area-inset-bottom));
  background:linear-gradient(180deg,rgba(0,0,0,.22),transparent);
  border-top:1px solid var(--border);flex-shrink:0;
}

.cart-empty{
  text-align:center;padding:50px 20px;color:var(--text-3);
}
.cart-empty-icon{
  width:72px;height:72px;margin:0 auto 16px;border-radius:50%;
  display:grid;place-items:center;background:var(--surface-2);border:1px solid var(--border);
  color:var(--text-3);animation:floatY 3s ease-in-out infinite;
}
@keyframes floatY{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.cart-empty p{font-size:14px;font-weight:700;color:var(--text-2);margin-bottom:4px}
.cart-empty small{font-size:12px}

.cart-item{
  display:flex;align-items:center;gap:12px;padding:14px 0;
  border-bottom:1px dashed var(--border);
  animation:slideIn 320ms var(--ease-spring) both;
}
.cart-item:last-child{border-bottom:none}
@keyframes slideIn{from{opacity:0;transform:translateX(-12px)}to{opacity:1;transform:translateX(0)}}
.ci-emoji{
  width:44px;height:44px;border-radius:12px;flex-shrink:0;
  display:grid;place-items:center;font-size:22px;
  background:radial-gradient(circle at 30% 30%,rgba(244,163,0,.20),var(--surface));
  border:1px solid rgba(244,163,0,.22);
}
.ci-info{flex:1;min-width:0}
.ci-info strong{display:block;font-size:13px;font-weight:700;line-height:1.3;margin-bottom:2px;color:var(--text)}
.ci-info small{font-size:11.5px;color:var(--text-3)}
.qty-ctrl{
  display:inline-flex;align-items:center;gap:4px;
  background:var(--surface);border:1px solid var(--border);
  border-radius:var(--r-full);padding:3px;flex-shrink:0;
}
.qty-btn{
  width:28px;height:28px;border-radius:50%;display:grid;place-items:center;
  color:var(--text-2);transition:all var(--t-fast) var(--ease-spring);
}
.qty-btn:hover{background:var(--surface-3);color:var(--text)}
.qty-btn.minus:hover{color:var(--danger);background:rgba(239,68,68,.14)}
.qty-btn.plus:hover{color:var(--success);background:var(--success-soft)}
.qty-btn:active{transform:scale(.88)}
.qty-num{
  min-width:24px;text-align:center;font-size:13px;font-weight:800;color:var(--text);
  font-variant-numeric:tabular-nums;
}
.ci-sub{
  font-size:13px;font-weight:800;color:var(--accent);
  min-width:70px;text-align:right;flex-shrink:0;
  font-variant-numeric:tabular-nums;
}

.total-row{
  display:flex;align-items:baseline;justify-content:space-between;margin-bottom:14px;
}
.total-row .label{font-size:11.5px;font-weight:700;color:var(--text-3);text-transform:uppercase;letter-spacing:.6px}
.total-row .amount{
  font-size:24px;font-weight:800;

.btn{

}

.btn:disabled{opacity:.5;cursor:not-allowed}

.btn-block{width:100%}
.btn-primary{background:linear-gradient(135deg,var(--primary),var(--primary-600));color:#fff;box-shadow:0 8px 22px rgba(230,57,70,.4)}

.btn-success{background:linear-gradient(135deg,#22C55E,#16A34A);color:#fff;box-shadow:0 8px 22px rgba(34,197,94,.4)}
.btn-success:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 12px 28px rgba(34,197,94,.55)}
.btn-ghost{background:var(--surface-2);color:var(--text);border:1px solid var(--border)}
.btn-ghost:hover:not(:disabled){background:var(--surface-3);border-color:var(--border-strong)}
.ripple{
  position:absolute;border-radius:50%;background:rgba(255,255,255,.45);
  transform:scale(0);animation:rippleAnim 620ms var(--ease-smooth) forwards;
  pointer-events:none;
}
@keyframes rippleAnim{to{transform:scale(4);opacity:0}}

.form-section{margin-bottom:16px}
.form-section label{
  display:block;font-size:10.5px;font-weight:800;color:var(--text-3);
  text-transform:uppercase;letter-spacing:.7px;margin-bottom:8px;
}
.form-input{
  width:100%;padding:13px 16px;border-radius:12px;
  background:var(--surface-2);border:1.5px solid var(--border);
  color:var(--text);font-size:15px;font-weight:600;
  transition:all var(--t);font-family:var(--font);
}

.form-input:focus{outline:none;border-color:var(--purple);background:var(--surface-3);box-shadow:0 0 0 4px rgba(168,85,247,.16)}
.form-input::placeholder{color:var(--text-3);font-weight:500}
.form-input.error{border-color:var(--danger);box-shadow:0 0 0 4px rgba(239,68,68,.16)}
textarea.form-input{resize:vertical;min-height:64px}

.type-tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.type-tab{
  display:flex;flex-direction:column;align-items:center;gap:5px;
  padding:14px 6px;border-radius:12px;
  background:var(--surface);border:1.5px solid var(--border);
  color:var(--text-3);font-weight:700;font-size:11px;
  transition:all var(--t) var(--ease-spring);text-align:center;
}
.type-tab:hover{color:var(--text);border-color:var(--border-strong);transform:translateY(-2px)}
.type-tab.active{

}
.type-tab .tab-icon{font-size:22px;line-height:1;transition:transform var(--t) var(--ease-spring)}
.type-tab.active .tab-icon{transform:scale(1.15)}
.type-tab .tab-label{font-size:10.5px;letter-spacing:.2px}

.eta-pills{display:flex;flex-wrap:wrap;gap:6px}
.eta-pills button{
  padding:9px 14px;border-radius:var(--r-full);
  background:var(--surface-2);border:1.5px solid var(--border);
  color:var(--text-2);font-size:12px;font-weight:700;
  transition:all var(--t) var(--ease-spring);
}
.eta-pills button:hover{color:var(--text);border-color:var(--border-strong);transform:translateY(-1px)}

  background:linear-gradient(135deg,#F4A300,#E63946);color:#fff;border-color:transparent;
  box-shadow:0 6px 18px rgba(244,163,0,.5);
}

.success-overlay{
  position:fixed;inset:0;z-index:1500;

  display:grid;place-items:center;padding:20px;overflow-y:auto;
}
.success-overlay.show{opacity:1;visibility:visible}
.success-card{
  width:100%;max-width:400px;text-align:center;

  background:linear-gradient(170deg,#1E1209,#140B06);

  transform:scale(.9);transition:transform var(--t-slow) var(--ease-spring);
}
.success-overlay.show .success-card{transform:scale(1)}
.success-icon{
  width:80px;height:80px;margin:0 auto 20px;border-radius:50%;

  background:linear-gradient(135deg,#22C55E,#16A34A);color:#fff;
  box-shadow:0 12px 30px rgba(34,197,94,.5);
  animation:successPop 620ms var(--ease-spring) 200ms both;
}

.success-card h2{font-size:22px;font-weight:800;margin-bottom:8px;letter-spacing:-.3px}
.success-card>p{font-size:13px;color:var(--text-2);line-height:1.6;margin-bottom:22px}
.queue-box{
  padding:20px 24px;border-radius:16px;margin-bottom:22px;

.queue-box .hint{font-size:10.5px;color:var(--text-3);letter-spacing:0}
.success-actions{display:grid;grid-template-columns:1fr;gap:8px}

.toast-container{

.toast{

.toast.error{border-left-color:var(--danger)}

.toast.info .t-icon{color:var(--info)}
.toast .t-icon{flex-shrink:0}

.reveal{opacity:0;transform:translateY(20px);transition:opacity .6s var(--ease-smooth),transform .6s var(--ease-smooth)}

@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}

const debounce = (fn, d = 200) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), d); }; };
const REDUCED = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

let audioCtx = null;
function playTone(freq = 880, dur = 80, type = 'sine', gain = 0.04) {
  if (!state.soundOn || REDUCED) return;
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const osc = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    osc.type = type; osc.frequency.value = freq;
    g.gain.setValueAtTime(gain, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + dur/1000);
    osc.connect(g); g.connect(audioCtx.destination);
    osc.start(); osc.stop(audioCtx.currentTime + dur/1000);
  } catch (_) {}
}
function haptic(pattern = 12) {
  if (!state.hapticOn || REDUCED) return;
  try { navigator.vibrate && navigator.vibrate(pattern); } catch (_) {}
}

const TOAST_ICONS = {
  success: '<svg class="t-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>',
  error: '<svg class="t-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="15" x2="9" y1="9" y2="15"/><line x1="9" x2="15" y1="9" y2="15"/></svg>',
  info: '<svg class="t-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>'
};
function toast(msg, type = 'info', dur = 2600) {
  const c = $('#toastContainer');
  const t = document.createElement('div');
  t.className = `toast ${type}`;
  t.innerHTML = `${TOAST_ICONS[type] || TOAST_ICONS.info}<span class="t-msg">${esc(msg)}</span>`;
  c.appendChild(t);
  setTimeout(() => {
    t.classList.add('out');
    setTimeout(() => t.remove(), 300);
  }, dur);
}

function attachRipple(node) {
  if (!node || node.dataset.ripple === '1') return;
  node.dataset.ripple = '1';
  node.addEventListener('pointerdown', (e) => {
    if (REDUCED) return;
    const rect = node.getBoundingClientRect();
    const size = Math.max(rect.width, rect.height);
    const span = document.createElement('span');
    span.className = 'ripple';
    span.style.width = span.style.height = size + 'px';
    span.style.left = (e.clientX - rect.left - size/2) + 'px';
    span.style.top = (e.clientY - rect.top - size/2) + 'px';
    node.appendChild(span);
    span.addEventListener('animationend', () => span.remove(), { once: true });
  });
}
function bindRipples(root = document) {
  $$('.btn,.chip,.type-tab,.eta-pills button,.btn-add,.qty-btn,.btn-view-cart,.sheet-close', root).forEach(attachRipple);
}
function flyEmoji(emoji, fromEl, toEl) {
  if (REDUCED || !fromEl || !toEl) return;
  const from = fromEl.getBoundingClientRect();
  const to = toEl.getBoundingClientRect();
  const clone = document.createElement('div');
  clone.className = 'fly-emoji';
  clone.textContent = emoji;
  clone.style.left = (from.left + from.width/2 - 16) + 'px';
  clone.style.top = (from.top + from.height/2 - 16) + 'px';
  document.body.appendChild(clone);
  requestAnimationFrame(() => {
    clone.style.left = (to.left + to.width/2 - 16) + 'px';
    clone.style.top = (to.top + to.height/2 - 16) + 'px';
    clone.style.transform = 'scale(.3) rotate(180deg)';
    clone.style.opacity = '0';
  });
  setTimeout(() => { try { clone.remove(); } catch (_) {} }, 700);
}

const cartQtyTot = () => state.cart.reduce((s, i) => s + i.qty, 0);
const findCart = id => state.cart.find(c => c.id === id);

function addToCart(id) {
  const menu = MENU.find(m => m.id === id); if (!menu) return;
  const item = findCart(id);
  if (item) {
    if (item.qty >= 999) { toast('Batas maksimum', 'error'); return; }
    item.qty += 1;
  } else {
    state.cart.push({ id, nama: menu.nama, harga: menu.harga, qty: 1, emoji: menu.emoji });
  }
  renderCart();
  updateBadges();
  bounceBadge(id);
  playTone(660, 60, 'sine', 0.04);
  haptic(12);
  const cardEl = $(`#menuGrid [data-id="${id}"] .card-emoji`);
  const cartTarget = $('#barCartBtn') || $('#bottomBar');
  if (cardEl && cartTarget) flyEmoji(menu.emoji, cardEl, cartTarget);
}
function decreaseQty(id) {
  const item = findCart(id); if (!item) return;
  if (item.qty > 1) item.qty -= 1;
  else state.cart = state.cart.filter(c => c.id !== id);
  renderCart(); updateBadges();
}
function updateBadges() {
  MENU.forEach(m => {
    const b = $(`#menuGrid [data-badge="${m.id}"]`); if (!b) return;
    const item = findCart(m.id);
    const q = item ? item.qty : 0;
    b.textContent = q;

  const tot = cartQtyTot();

}
function bounceBadge(id) {
  const b = $(`#menuGrid [data-badge="${id}"]`);

}

async function submitOrder() {
  if (state.processing) return;
  if (state.cart.length === 0) { toast('Keranjang kosong', 'error'); return; }

  const name = $('#inName').value.trim();
  const phone = $('#inPhone').value.trim().replace(/[^\d+]/g, '');
  const table = $('#inTable').value.trim();
  const address = $('#inAddress').value.trim();
  const note = $('#inNote').value.trim().slice(0, 200);

  if (!phone) { $('#inPhone').classList.add('error'); toast('No. HP wajib diisi', 'error'); return; }
  if (!validatePhone(phone)) { $('#inPhone').classList.add('error'); toast('Format no. HP tidak valid', 'error'); return; }
  if (state.orderType === 'dinein' && !table) { $('#inTable').classList.add('error'); toast('Nomor meja wajib diisi', 'error'); return; }
  if (state.orderType !== 'dinein' && !name) { $('#inName').classList.add('error'); toast('Nama wajib diisi', 'error'); return; }
  if (state.orderType === 'delivery' && !address) { $('#inAddress').classList.add('error'); toast('Alamat wajib diisi', 'error'); return; }

  state.processing = true;
  const btn = $('#btnSubmit');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span> Mengirim…';

  const invoice = 'ONL-' + Date.now().toString(36).toUpperCase();
  const total = cartSubtotal();

  const orderData = {
    invoice,
    items: state.cart.map(i => ({ name: i.nama, qty: i.qty, price: i.harga, note: '' })),
    total,
    orderType: state.orderType,
    tableNumber: state.orderType === 'dinein' ? table : '',
    customerName: state.orderType === 'dinein' ? '' : name,
    customerPhone: phone,
    customerAddress: state.orderType === 'delivery' ? address : '',
    orderNote: note,
    etaMinutes: state.eta,
    status: 'new',
    createdAt: Date.now(),
    date: new Date().toLocaleString('id-ID')
  };

  try {
    const orderRef = push(ref(db, `stores/${STORE_ID}/orders`));
    await set(orderRef, orderData);

    playTone(880, 100, 'sine', 0.06);
    setTimeout(() => playTone(1320, 140, 'sine', 0.05), 90);
    haptic([20, 40, 20]);

    const shortId = orderRef.key.slice(-6).toUpperCase();
    $('#successQueue').textContent = shortId;
    closeSheet('#formSheet');
    setTimeout(() => openSheet('#successOverlay'), 220);

    state.cart = [];
    renderCart();
    updateBadges();
  } catch (err) {
    console.error(err);
    let msg = 'Gagal mengirim pesanan';
    if (err && err.message) msg = err.message.slice(0, 120);
    toast(msg, 'error', 5000);
  } finally {
    state.processing = false;
    btn.disabled = false;
    btn.innerHTML = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></svg> Kirim Pesanan ke Warung';
  }
}

function initReveal() {
  if (!('IntersectionObserver' in window) || REDUCED) {
    $$('.reveal').forEach(n => n.classList.add('in'));
    return;
  }
  const io = new IntersectionObserver((entries) => {
    entries.forEach(en => {
      if (en.isIntersecting) { en.target.classList.add('in'); io.unobserve(en.target); }
    });
  }, { threshold: 0.1, rootMargin: '0px 0px -30px 0px' });
  $$('.reveal').forEach(n => io.observe(n));
}

function bindEvents() {
  const searchEl = $('#searchInput');
  const clearEl = $('#searchClear');
  searchEl.addEventListener('input', debounce(e => {
    state.search = e.target.value.trim();
    clearEl.style.display = state.search ? 'grid' : 'none';
    renderMenu();
  }, 140));
  clearEl.addEventListener('click', () => {
    searchEl.value = ''; state.search = '';
    clearEl.style.display = 'none';
    renderMenu();
  });

  $('#chips').addEventListener('click', e => {
    const c = e.target.closest('.chip'); if (!c) return;
    state.filter = c.dataset.cat;
    $$('.chip', $('#chips')).forEach(ch => {
      const a = ch.dataset.cat === state.filter;
      ch.classList.toggle('active', a);
      ch.setAttribute('aria-selected', String(a));
    });
    renderMenu();
    haptic(8);
  });

  $('#menuGrid').addEventListener('click', e => {
    const card = e.target.closest('.menu-card'); if (!card) return;
    addToCart(parseInt(card.dataset.id, 10));
  });
  $('#menuGrid').addEventListener('keydown', e => {
    const card = e.target.closest('.menu-card'); if (!card) return;
    if (e.key === 'Enter' || e.key === ' ') {
      e.preventDefault();
      addToCart(parseInt(card.dataset.id, 10));
    }
  });

  $('#cartBody').addEventListener('click', e => {
    const b = e.target.closest('.qty-btn'); if (!b) return;
    const id = parseInt(b.dataset.id, 10);
    if (b.dataset.act === 'plus') addToCart(id);
    else decreaseQty(id);
  });

  $('#barCartBtn').addEventListener('click', openCartSheet);
  $('#btnViewCart').addEventListener('click', openCartSheet);
  $('#btnContinue').addEventListener('click', () => {
    closeSheet('#cartSheet');
    setTimeout(openFormSheet, 200);
  });

  document.querySelectorAll('[data-close-cart]').forEach(b => b.addEventListener('click', () => closeSheet('#cartSheet')));
  document.querySelectorAll('[data-close-form]').forEach(b => b.addEventListener('click', () => closeSheet('#formSheet')));
  $('#cartSheet').addEventListener('click', e => { if (e.target.id === 'cartSheet') closeSheet('#cartSheet'); });
  $('#formSheet').addEventListener('click', e => { if (e.target.id === 'formSheet') closeSheet('#formSheet'); });

  $('#typeTabs').addEventListener('click', e => {
    const t = e.target.closest('.type-tab'); if (!t) return;
    state.orderType = t.dataset.type;
    updateFormTypeUI();
    haptic(8);
    setTimeout(() => {
      if (state.orderType === 'dinein') $('#inTable').focus();
      else if (state.orderType === 'delivery') $('#inAddress').focus();
      else $('#inName').focus();
    }, 120);
  });

  $('#etaPills').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    state.eta = parseInt(b.dataset.eta, 10) || 20;
    $$('#etaPills button').forEach(x => x.classList.toggle('active', x === b));
    haptic(6);
  });

  ['inTable','inName','inPhone','inAddress'].forEach(id => {
    const el = document.getElementById(id);
    el.addEventListener('input', () => el.classList.remove('error'));
  });
  $('#inPhone').addEventListener('input', e => {
    e.target.value = e.target.value.replace(/[^\d+]/g, '');
  });

  $('#btnSubmit').addEventListener('click', submitOrder);

  $('#btnNewOrder').addEventListener('click', () => {
    closeSheet('#successOverlay');
    setTimeout(() => window.scrollTo({ top: 0, behavior: 'smooth' }), 200);
  });

  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') {
      if ($('#successOverlay').classList.contains('show')) closeSheet('#successOverlay');
      else if ($('#formSheet').classList.contains('show')) closeSheet('#formSheet');
      else if ($('#cartSheet').classList.contains('show')) closeSheet('#cartSheet');
    }
  });

  let lastTouch = 0;
  document.addEventListener('touchend', e => {
    const now = Date.now();
    if (now - lastTouch <= 300) e.preventDefault();
    lastTouch = now;
  }, { passive: false });
}

function init() {
  renderChips();
  renderMenu();
  renderCart();
  updateBadges();
  bindEvents();
  initReveal();
  bindRipples();
  setTimeout(() => toast('Selamat datang! 👋 Silakan pilih menu', 'info', 2800), 800);
}

if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init, { once: true });
else init();
</script>
</script>
