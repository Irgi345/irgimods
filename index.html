<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=5.0">
<meta name="theme-color" content="#1A0E08">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="format-detection" content="telephone=no">
<title>Masuk — Warung Cakrawala Sego Sambel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;600;800&display=swap">
<style>
/* ═══════════════════════════════════════════════════════════════════
   TOKENS + BASE (identik dengan index.html asli)
   ═══════════════════════════════════════════════════════════════════ */
:root{
  --primary:#E63946; --primary-600:#C42A38; --primary-700:#A01F2C; --primary-soft:rgba(230,57,70,.14);
  --accent:#F4A300; --accent-600:#D98F00; --accent-soft:rgba(244,163,0,.15);
  --success:#22C55E; --danger:#EF4444;
  --purple:#A855F7; --purple-soft:rgba(168,85,247,.14);
  --bg:#0F0805;
  --surface:rgba(255,240,225,.045);
  --surface-2:rgba(255,240,225,.075);
  --surface-3:rgba(255,240,225,.115);
  --border:rgba(255,220,180,.10);
  --border-strong:rgba(255,220,180,.22);
  --text:#FFF6EC; --text-2:#D4BFA9; --text-3:#A89078;
  --r-sm:12px; --r:16px; --r-lg:20px; --r-xl:24px; --r-full:9999px;
  --shadow:0 8px 24px rgba(0,0,0,.42),0 2px 6px rgba(0,0,0,.28);
  --shadow-lg:0 22px 60px rgba(0,0,0,.55),0 6px 18px rgba(0,0,0,.35);
  --ease-spring:cubic-bezier(0.34,1.56,0.64,1);
  --ease-smooth:cubic-bezier(0.4,0,0.2,1);
  --t:220ms;
  --font:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --font-mono:'JetBrains Mono','Courier New',monospace;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  font-family:var(--font);background:var(--bg);color:var(--text);
  min-height:100dvh;line-height:1.5;-webkit-font-smoothing:antialiased;
  display:grid;place-items:center;padding:20px;overflow-x:hidden;
  padding-bottom:max(20px,env(safe-area-inset-bottom));
}
body::after{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:1;opacity:.035;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
  mix-blend-mode:overlay;
}
body::before{
  content:'';position:fixed;border-radius:50%;filter:blur(120px);opacity:.30;pointer-events:none;z-index:-1;
  width:480px;height:480px;background:radial-gradient(circle,#E63946 0%,transparent 70%);
  top:-180px;left:-160px;animation:float1 22s ease-in-out infinite;
}
.bg-blob-2{
  position:fixed;border-radius:50%;filter:blur(120px);opacity:.28;pointer-events:none;z-index:-1;
  width:520px;height:520px;background:radial-gradient(circle,#F4A300 0%,transparent 70%);
  bottom:-220px;right:-200px;animation:float2 26s ease-in-out infinite;
}
@keyframes float1{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(60px,40px) scale(1.08)}}
@keyframes float2{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(-50px,-30px) scale(1.06)}}

/* ═══════════════════════════════════════════════════════════════════
   LOGIN — identik dengan index.html asli
   ═══════════════════════════════════════════════════════════════════ */
.login-wrap{width:100%;max-width:440px;position:relative;z-index:2;animation:fadeUp 620ms var(--ease-spring) both}
@keyframes fadeUp{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}

.login-card{
  padding:32px 26px 26px;border-radius:var(--r-xl);
  background:linear-gradient(170deg,rgba(30,18,9,.92),rgba(20,11,6,.96));
  border:1px solid var(--border-strong);
  backdrop-filter:blur(20px) saturate(160%);-webkit-backdrop-filter:blur(20px) saturate(160%);
  box-shadow:var(--shadow-lg),0 0 100px rgba(230,57,70,.08);
  position:relative;overflow:hidden;
}
.login-card::before{
  content:'';position:absolute;top:0;left:0;right:0;height:3px;
  background:linear-gradient(90deg,transparent,var(--accent),var(--primary),transparent);
  background-size:200% 100%;animation:shimmer 4s linear infinite;
}
@keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}

.logo-badge{
  width:80px;height:80px;margin:0 auto 20px;border-radius:22px;
  display:grid;place-items:center;font-size:40px;
  background:linear-gradient(135deg,var(--primary),var(--primary-700));
  box-shadow:0 14px 36px rgba(230,57,70,.5),inset 0 1px 0 rgba(255,255,255,.2);
  animation:logoFloat 4s ease-in-out infinite;
  position:relative;
}
.logo-badge::after{
  content:'';position:absolute;inset:-4px;border-radius:26px;
  background:linear-gradient(135deg,rgba(244,163,0,.6),transparent 60%);
  opacity:.6;filter:blur(10px);z-index:-1;
}
@keyframes logoFloat{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-6px) rotate(-2deg)}}

.brand-head{text-align:center;margin-bottom:28px}
.brand-head h1{
  font-size:24px;font-weight:900;letter-spacing:-.5px;line-height:1.15;
  margin-bottom:6px;
}
.brand-head h1 span{
  background:linear-gradient(90deg,var(--accent),var(--primary));
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.brand-head p{font-size:12.5px;color:var(--text-2);font-weight:500}
.brand-head .tagline{
  display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:700;
  color:var(--accent);padding:3px 10px;border-radius:var(--r-full);
  background:var(--accent-soft);border:1px solid rgba(244,163,0,.3);
  margin-top:10px;letter-spacing:.3px;
}

.role-label{
  font-size:10.5px;font-weight:800;color:var(--text-3);
  text-transform:uppercase;letter-spacing:.7px;margin-bottom:10px;
  text-align:center;
}

.role-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:20px}
.role-btn{
  position:relative;overflow:hidden;padding:18px 12px;
  border-radius:var(--r);background:var(--surface);
  border:2px solid var(--border);color:var(--text-2);
  text-align:center;cursor:pointer;
  transition:all var(--t) var(--ease-spring);
  display:flex;flex-direction:column;align-items:center;gap:8px;
}
.role-btn:hover:not(:disabled){
  transform:translateY(-3px);
  background:var(--surface-2);
  border-color:var(--border-strong);
}
.role-btn:active{transform:scale(.97)}
.role-btn .role-emoji{
  font-size:32px;line-height:1;
  filter:grayscale(.35) opacity(.75);
  transition:all var(--t) var(--ease-spring);
}
.role-btn .role-title{font-size:14px;font-weight:800;color:var(--text);letter-spacing:-.1px}
.role-btn .role-sub{font-size:10.5px;font-weight:600;color:var(--text-3);line-height:1.3}

.role-btn.active{
  background:linear-gradient(135deg,rgba(230,57,70,.18),rgba(244,163,0,.10));
  border-color:var(--primary);
  box-shadow:0 12px 32px rgba(230,57,70,.35),inset 0 1px 0 rgba(255,255,255,.08);
}
.role-btn.active .role-emoji{filter:none;transform:scale(1.1)}
.role-btn.active .role-title{color:#fff}
.role-btn.active .role-sub{color:rgba(255,255,255,.75)}
.role-btn[data-role="kasir"].active{
  background:linear-gradient(135deg,rgba(168,85,247,.20),rgba(168,85,247,.08));
  border-color:var(--purple);
  box-shadow:0 12px 32px rgba(168,85,247,.4),inset 0 1px 0 rgba(255,255,255,.08);
}
.role-btn .check-icon{
  position:absolute;top:8px;right:8px;width:20px;height:20px;border-radius:50%;
  background:var(--primary);color:#fff;display:grid;place-items:center;
  font-size:11px;font-weight:900;
  opacity:0;transform:scale(0);
  transition:all var(--t) var(--ease-spring);
}
.role-btn[data-role="kasir"].active .check-icon{background:var(--purple)}
.role-btn.active .check-icon{opacity:1;transform:scale(1)}

.password-box{
  max-height:0;overflow:hidden;opacity:0;
  transition:max-height .35s var(--ease-smooth),opacity .25s ease,margin .35s var(--ease-smooth);
  margin-bottom:0;
}
.password-box.show{max-height:200px;opacity:1;margin-bottom:20px}
.password-box label{
  display:block;font-size:10.5px;font-weight:800;color:var(--text-3);
  text-transform:uppercase;letter-spacing:.7px;margin-bottom:8px;
}
.password-input-wrap{position:relative}
.password-input-wrap .lock-icon{
  position:absolute;left:14px;top:50%;transform:translateY(-50%);
  color:var(--text-3);pointer-events:none;
}
.password-input{
  width:100%;padding:14px 44px 14px 42px;border-radius:12px;
  background:var(--surface-2);border:1.5px solid var(--border);
  color:var(--text);font-size:16px;font-weight:600;font-family:var(--font-mono);
  letter-spacing:2px;
  transition:all var(--t);
}
@media (min-width:481px){.password-input{font-size:15px}}
.password-input:focus{
  outline:none;border-color:var(--purple);
  background:var(--surface-3);
  box-shadow:0 0 0 4px rgba(168,85,247,.16);
}
.password-input.error{
  border-color:var(--danger);
  box-shadow:0 0 0 4px rgba(239,68,68,.16);
  animation:shake 480ms var(--ease-smooth);
}
@keyframes shake{
  0%,100%{transform:translateX(0)}
  20%{transform:translateX(-10px)}
  40%{transform:translateX(10px)}
  60%{transform:translateX(-6px)}
  80%{transform:translateX(6px)}
}
.toggle-pass{
  position:absolute;right:8px;top:50%;transform:translateY(-50%);
  width:32px;height:32px;border-radius:50%;display:grid;place-items:center;
  color:var(--text-3);transition:all var(--t);
}
.toggle-pass:hover{background:var(--surface-3);color:var(--text-2)}

.error-msg{
  font-size:11.5px;color:var(--danger);font-weight:700;margin-top:8px;
  display:flex;align-items:center;gap:5px;
  opacity:0;transform:translateY(-4px);
  transition:all .25s ease;
  min-height:16px;
}
.error-msg.show{opacity:1;transform:translateY(0)}

.btn-submit{
  position:relative;overflow:hidden;
  width:100%;padding:16px 22px;border-radius:14px;
  font-size:15px;font-weight:800;letter-spacing:.2px;
  background:linear-gradient(135deg,var(--primary),var(--primary-600));
  color:#fff;
  box-shadow:0 10px 28px rgba(230,57,70,.42),inset 0 1px 0 rgba(255,255,255,.18);
  transition:all var(--t) var(--ease-spring);
  display:flex;align-items:center;justify-content:center;gap:10px;
  cursor:pointer;border:none;
}
.btn-submit:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 16px 36px rgba(230,57,70,.55)}
.btn-submit:active:not(:disabled){transform:scale(.97)}
.btn-submit:disabled{opacity:.5;cursor:not-allowed;transform:none!important}
.btn-submit.success{
  background:linear-gradient(135deg,#22C55E,#16A34A);
  box-shadow:0 10px 28px rgba(34,197,94,.42);
}
.ripple{
  position:absolute;border-radius:50%;background:rgba(255,255,255,.45);
  transform:scale(0);animation:rippleAnim 620ms var(--ease-smooth) forwards;
  pointer-events:none;
}
@keyframes rippleAnim{to{transform:scale(4);opacity:0}}
.spinner{
  width:16px;height:16px;border:2.5px solid rgba(255,255,255,.28);
  border-top-color:#fff;border-radius:50%;animation:spin .65s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}

.login-footer{
  text-align:center;margin-top:22px;padding-top:18px;
  border-top:1px dashed var(--border);
  font-size:10.5px;color:var(--text-3);font-weight:500;
}
.login-footer .divider{
  display:flex;align-items:center;gap:8px;justify-content:center;margin-bottom:10px;
}
.login-footer .divider::before,
.login-footer .divider::after{
  content:'';flex:1;height:1px;background:var(--border);max-width:60px;
}
.login-footer .divider span{font-size:14px;opacity:.6}

.toast-wrap{
  position:fixed;top:20px;left:20px;right:20px;z-index:2000;
  display:flex;flex-direction:column;gap:8px;pointer-events:none;
  max-width:440px;margin:0 auto;
}
.toast{
  pointer-events:auto;position:relative;
  display:flex;align-items:center;gap:10px;
  padding:13px 16px;border-radius:14px;
  background:linear-gradient(135deg,#241609,#180D06);
  border:1px solid var(--border-strong);border-left:3px solid var(--danger);
  box-shadow:var(--shadow-lg);font-size:13px;font-weight:600;
  animation:toastIn 340ms var(--ease-spring);
}
@keyframes toastIn{from{opacity:0;transform:translateY(-16px) scale(.94)}to{opacity:1;transform:translateY(0) scale(1)}}
.toast.out{animation:toastOut 280ms var(--ease-smooth) forwards}
@keyframes toastOut{to{opacity:0;transform:translateY(-16px) scale(.94)}}
.toast .t-icon{flex-shrink:0;color:var(--danger)}
.toast .t-msg{flex:1;line-height:1.4}

/* ═══════════════════════════════════════════════════════════════════
   TAMBAHAN: IFRAME APP + LOADING + LOGOUT
   ═══════════════════════════════════════════════════════════════════ */
body.booting .login-wrap{visibility:hidden}
body.app-active{
  display:block;
  padding:0;
  overflow:hidden;
  background:#0F0805;
}
body.app-active::before,
body.app-active::after,
body.app-active .bg-blob-2{display:none}

.app-frame{
  position:fixed;
  inset:0;
  width:100vw;
  height:100vh;
  height:100dvh;
  border:0;
  display:none;
  z-index:100;
  background:#0F0805;
  opacity:0;
  transition:opacity .3s ease;
}
.app-frame.active{display:block}
.app-frame.ready{opacity:1}

.loading-overlay{
  position:fixed;inset:0;z-index:1500;
  display:none;
  place-items:center;
  background:radial-gradient(circle at 50% 40%,rgba(230,57,70,.16),rgba(8,3,2,.96) 65%);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
}
.loading-overlay.show{display:grid}
.loading-inner{display:flex;flex-direction:column;align-items:center;gap:18px;text-align:center}
.loading-spinner{
  width:52px;height:52px;border-radius:50%;
  border:3px solid rgba(244,163,0,.18);
  border-top-color:var(--accent);
  border-right-color:var(--primary);
  animation:spin .85s linear infinite;
  box-shadow:0 0 40px rgba(244,163,0,.35);
}
.loading-text{
  font-size:13px;font-weight:700;color:var(--text-2);
  letter-spacing:.4px;
  animation:pulseFade 1.6s ease-in-out infinite;
}
.loading-emoji{font-size:32px;animation:logoFloat 2.6s ease-in-out infinite}
@keyframes pulseFade{0%,100%{opacity:.55}50%{opacity:1}}

.logout-fab{
  position:fixed;
  bottom:14px;
  right:14px;
  width:38px;height:38px;
  border-radius:50%;
  background:rgba(230,57,70,.9);
  color:#fff;
  display:none;
  place-items:center;
  border:1.5px solid rgba(255,255,255,.22);
  cursor:pointer;
  z-index:9000;
  box-shadow:0 8px 22px rgba(0,0,0,.55),0 0 24px rgba(230,57,70,.45);
  opacity:.45;
  transition:opacity .25s var(--ease-smooth),transform .25s var(--ease-spring);
  -webkit-tap-highlight-color:transparent;
}
.logout-fab:hover{opacity:1;transform:scale(1.08)}
.logout-fab:active{transform:scale(.94)}
.logout-fab.active{display:grid}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;transition-duration:.001ms!important}
  body::before,.bg-blob-2{display:none}
}
@media (max-width:400px){
  .login-card{padding:26px 20px 22px}
  .brand-head h1{font-size:21px}
  .logo-badge{width:70px;height:70px;font-size:34px}
  .role-btn{padding:16px 8px}
  .role-btn .role-emoji{font-size:28px}
}
</style>
</head>
<body class="booting">
<div class="bg-blob-2" aria-hidden="true"></div>

<!-- ═══════════════ LOGIN VIEW ═══════════════ -->
<div class="login-wrap" id="loginView">
  <div class="login-card" role="main">
    <div class="logo-badge" aria-hidden="true">🍚</div>

    <div class="brand-head">
      <h1>Cakrawala <span>Sego Sambel</span></h1>
      <p>Khas Kudus · Sejak 2015</p>
      <div class="tagline">✨ Pedasnya Bikin Nagih</div>
    </div>

    <div class="role-label">Pilih Peran Anda</div>

    <div class="role-grid" id="roleGrid" role="radiogroup" aria-label="Pilih peran">
      <button type="button" class="role-btn" data-role="pembeli" role="radio" aria-checked="false">
        <span class="role-emoji" aria-hidden="true">🛒</span>
        <span class="role-title">Pembeli</span>
        <span class="role-sub">Pesan makanan & minuman</span>
        <span class="check-icon" aria-hidden="true">✓</span>
      </button>
      <button type="button" class="role-btn" data-role="kasir" role="radio" aria-checked="false">
        <span class="role-emoji" aria-hidden="true">💼</span>
        <span class="role-title">Kasir</span>
        <span class="role-sub">Kelola transaksi warung</span>
        <span class="check-icon" aria-hidden="true">✓</span>
      </button>
    </div>

    <div class="password-box" id="passwordBox">
      <label for="passwordInput">Password Kasir</label>
      <div class="password-input-wrap">
        <svg class="lock-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="11" x="3" y="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        <input type="password" class="password-input" id="passwordInput" placeholder="••••••••" autocomplete="current-password" inputmode="text">
        <button type="button" class="toggle-pass" id="togglePass" aria-label="Tampilkan password">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </div>
      <div class="error-msg" id="errorMsg" role="alert">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" x2="12" y1="8" y2="12"/><line x1="12" x2="12.01" y1="16" y2="16"/></svg>
        <span id="errorText"></span>
      </div>
    </div>

    <button type="button" class="btn-submit" id="btnSubmit" disabled>
      <span id="btnLabel">Pilih peran dulu</span>
    </button>

    <div class="login-footer">
      <div class="divider"><span>🍚</span></div>
      © 2024 Warung Cakrawala · Kudus
    </div>
  </div>
</div>

<!-- ═══════════════ APP VIEW (iframe) ═══════════════ -->
<iframe
  id="appFrame"
  class="app-frame"
  title="Aplikasi Warung Cakrawala"
  allow="bluetooth; usb; serial; clipboard-write; microphone; camera; fullscreen; web-share"
  allowfullscreen
></iframe>

<!-- Loading overlay -->
<div class="loading-overlay" id="loadingOverlay" aria-hidden="true">
  <div class="loading-inner">
    <div class="loading-emoji">🍚</div>
    <div class="loading-spinner"></div>
    <div class="loading-text" id="loadingText">Menyiapkan halaman…</div>
  </div>
</div>

<!-- Logout FAB -->
<button type="button" class="logout-fab" id="logoutFab" aria-label="Keluar" title="Keluar / Ganti peran">
  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
    <polyline points="16 17 21 12 16 7"/>
    <line x1="21" x2="9" y1="12" y2="12"/>
  </svg>
</button>

<div class="toast-wrap" id="toastWrap" role="region" aria-live="polite"></div>

<script>
'use strict';
(() => {
/* ═══════════════════════════════════════════════════════════════════
   KONFIGURASI
   ═══════════════════════════════════════════════════════════════════ */
const PASSWORD_KASIR = 'cakrawala2024';     // ← GANTI PASSWORD DI SINI
const SESSION_KEY    = 'cakrawala_role';
const SESSION_TIME   = 'cakrawala_login_at';
const MAX_ATTEMPTS   = 5;
const LOCKOUT_SEC    = 30;
const SESSION_TTL_MS = 12 * 60 * 60 * 1000; // 12 jam

// Routing: role → file yang dibuka di iframe
const HOMES = {
  kasir:   'kasir.html',
  pembeli: 'pesan.html'
};
const LOADING_TEXT = {
  kasir:   'Menyiapkan kasir…',
  pembeli: 'Menyiapkan menu pesanan…'
};

/* ═══════════════════════════════════════════════════════════════════
   HELPERS
   ═══════════════════════════════════════════════════════════════════ */
const $  = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));

const state = {
  selectedRole: null,
  attempts: 0,
  lockedUntil: 0,
  processing: false,
  showPass: false,
  appOpened: false
};

function showError(msg) {
  const err = $('#errorMsg');
  $('#errorText').textContent = msg;
  err.classList.add('show');
  $('#passwordInput').classList.add('error');
  setTimeout(() => $('#passwordInput').classList.remove('error'), 700);
}
function clearError() {
  $('#errorMsg').classList.remove('show');
  $('#passwordInput').classList.remove('error');
}
function toast(msg) {
  const c = $('#toastWrap');
  const t = document.createElement('div');
  t.className = 'toast';
  t.innerHTML = `<svg class="t-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="15" x2="9" y1="9" y2="15"/><line x1="9" x2="15" y1="9" y2="15"/></svg><span class="t-msg">${msg}</span>`;
  c.appendChild(t);
  setTimeout(() => { t.classList.add('out'); setTimeout(() => t.remove(), 300); }, 3000);
}
function attachRipple(node) {
  if (!node || node.dataset.ripple === '1') return;
  node.dataset.ripple = '1';
  node.addEventListener('pointerdown', (e) => {
    const rect = node.getBoundingClientRect();
    const size = Math.max(rect.width, rect.height);
    const span = document.createElement('span');
    span.className = 'ripple';
    span.style.width = span.style.height = size + 'px';
    span.style.left = (e.clientX - rect.left - size / 2) + 'px';
    span.style.top  = (e.clientY - rect.top  - size / 2) + 'px';
    node.appendChild(span);
    span.addEventListener('animationend', () => span.remove(), { once: true });
  });
}

/* ═══════════════════════════════════════════════════════════════════
   ROLE SELECT
   ═══════════════════════════════════════════════════════════════════ */
function selectRole(role) {
  if (state.processing || state.lockedUntil > Date.now() || state.appOpened) return;
  state.selectedRole = role;
  $$('.role-btn').forEach(b => {
    const active = b.dataset.role === role;
    b.classList.toggle('active', active);
    b.setAttribute('aria-checked', String(active));
  });
  clearError();
  $('#passwordInput').value = '';

  const isKasir = role === 'kasir';
  $('#passwordBox').classList.toggle('show', isKasir);

  const btn = $('#btnSubmit');
  btn.disabled = false;
  btn.classList.remove('success');
  $('#btnLabel').textContent = isKasir ? 'Masuk sebagai Kasir' : 'Masuk sebagai Pembeli';

  if (isKasir) {
    setTimeout(() => { try { $('#passwordInput').focus(); } catch (_) {} }, 380);
  }
}

/* ═══════════════════════════════════════════════════════════════════
   KASIR LOCKOUT
   ═══════════════════════════════════════════════════════════════════ */
function verifyKasirPassword(input) {
  return String(input) === PASSWORD_KASIR;
}
function startLockout(seconds) {
  state.lockedUntil = Date.now() + seconds * 1000;
  const btn = $('#btnSubmit');
  const input = $('#passwordInput');
  btn.disabled = true;
  input.disabled = true;

  let remaining = seconds;
  $('#btnLabel').textContent = `Terkunci · ${remaining}s`;
  showError(`Terlalu banyak percobaan. Tunggu ${remaining} detik.`);

  const timer = setInterval(() => {
    remaining -= 1;
    if (remaining <= 0) {
      clearInterval(timer);
      state.lockedUntil = 0;
      state.attempts = 0;
      btn.disabled = false;
      input.disabled = false;
      clearError();
      $('#btnLabel').textContent = 'Masuk sebagai Kasir';
      input.focus();
    } else {
      $('#btnLabel').textContent = `Terkunci · ${remaining}s`;
      $('#errorText').textContent = `Terlalu banyak percobaan. Tunggu ${remaining} detik.`;
    }
  }, 1000);
}

/* ═══════════════════════════════════════════════════════════════════
   SESSION
   ═══════════════════════════════════════════════════════════════════ */
function saveSession(role) {
  try {
    sessionStorage.setItem(SESSION_KEY, role);
    sessionStorage.setItem(SESSION_TIME, String(Date.now()));
  } catch (_) {}
}
function readSession() {
  try {
    const role = sessionStorage.getItem(SESSION_KEY);
    const time = parseInt(sessionStorage.getItem(SESSION_TIME) || '0', 10);
    if (role && HOMES[role] && Date.now() - time < SESSION_TTL_MS) return role;
    sessionStorage.removeItem(SESSION_KEY);
    sessionStorage.removeItem(SESSION_TIME);
    return null;
  } catch (_) { return null; }
}
function clearSession() {
  try {
    sessionStorage.removeItem(SESSION_KEY);
    sessionStorage.removeItem(SESSION_TIME);
  } catch (_) {}
}

/* ═══════════════════════════════════════════════════════════════════
   APP OPENER (iframe fullscreen)
   ═══════════════════════════════════════════════════════════════════ */
function openApp(role) {
  if (!HOMES[role] || state.appOpened) return;
  state.appOpened = true;

  const frame  = $('#appFrame');
  const loader = $('#loadingOverlay');
  const fab    = $('#logoutFab');

  // Set body state
  document.body.classList.remove('booting');
  document.body.classList.add('app-active');

  // Sembunyikan login
  $('#loginView').style.display = 'none';

  // Tampilkan loader + iframe
  $('#loadingText').textContent = LOADING_TEXT[role] || 'Menyiapkan halaman…';
  loader.classList.add('show');
  loader.setAttribute('aria-hidden', 'false');
  frame.classList.add('active');

  // Handler load
  let done = false;
  const finalize = () => {
    if (done) return;
    done = true;
    frame.classList.add('ready');
    loader.classList.remove('show');
    loader.setAttribute('aria-hidden', 'true');
    fab.classList.add('active');
  };

  frame.addEventListener('load', () => setTimeout(finalize, 180), { once: true });

  // Fallback: kalau load event tidak muncul (mis. cache), tetap tampilkan
  setTimeout(finalize, 4500);

  // Set src (memicu load)
  frame.src = HOMES[role];
}

/* ═══════════════════════════════════════════════════════════════════
   LOGOUT
   ═══════════════════════════════════════════════════════════════════ */
function doLogout() {
  // Konfirmasi ringan
  const ok = window.confirm('Keluar dari akun dan kembali ke halaman login?');
  if (!ok) return;

  clearSession();

  // Reset iframe & UI
  const frame = $('#appFrame');
  try {
    frame.src = 'about:blank';
  } catch (_) { /* noop */ }
  frame.classList.remove('active', 'ready');
  frame.removeAttribute('src');

  $('#logoutFab').classList.remove('active');
  $('#loadingOverlay').classList.remove('show');

  // Reset state login
  state.selectedRole = null;
  state.processing = false;
  state.attempts = 0;
  state.lockedUntil = 0;
  state.showPass = false;
  state.appOpened = false;

  // Tampilkan login lagi
  document.body.classList.remove('app-active');
  document.body.classList.add('booting');
  const lv = $('#loginView');
  lv.style.display = '';
  // Reset pilihan role & password
  $$('.role-btn').forEach(b => { b.classList.remove('active'); b.setAttribute('aria-checked', 'false'); });
  $('#passwordBox').classList.remove('show');
  $('#passwordInput').value = '';
  $('#passwordInput').type = 'password';
  $('#passwordInput').disabled = false;
  const btn = $('#btnSubmit');
  btn.disabled = true;
  btn.classList.remove('success');
  btn.innerHTML = '<span id="btnLabel">Pilih peran dulu</span>';
  clearError();

  // Re-reveal
  requestAnimationFrame(() => {
    document.body.classList.remove('booting');
  });

  toast('Berhasil keluar');
}

/* ═══════════════════════════════════════════════════════════════════
   SUBMIT HANDLER
   ═══════════════════════════════════════════════════════════════════ */
async function handleSubmit() {
  if (state.processing || state.appOpened) return;
  if (!state.selectedRole) { toast('Pilih peran dulu'); return; }
  if (state.lockedUntil > Date.now()) { toast('Terkunci, tunggu sebentar'); return; }

  const role = state.selectedRole;
  const btn = $('#btnSubmit');
  const input = $('#passwordInput');

  if (role === 'kasir') {
    clearError();
    const pass = input.value;
    if (!pass) { showError('Password wajib diisi'); input.focus(); return; }

    state.processing = true;
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span><span>Memeriksa…</span>';

    await new Promise(r => setTimeout(r, 420));

    if (!verifyKasirPassword(pass)) {
      state.attempts += 1;
      state.processing = false;

      if (state.attempts >= MAX_ATTEMPTS) {
        startLockout(LOCKOUT_SEC);
        return;
      }
      const left = MAX_ATTEMPTS - state.attempts;
      showError(`Password salah. Sisa percobaan: ${left}`);
      input.value = '';
      input.focus();
      btn.disabled = false;
      btn.innerHTML = '<span id="btnLabel">Masuk sebagai Kasir</span>';
      return;
    }
  } else {
    state.processing = true;
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span><span>Membuka…</span>';
    await new Promise(r => setTimeout(r, 320));
  }

  // Sukses
  btn.classList.add('success');
  btn.innerHTML = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg><span>Berhasil! Membuka…</span>';

  saveSession(role);
  setTimeout(() => {
    openApp(role);
    // Reset tombol (untuk next-time logout)
    state.processing = false;
  }, 620);
}

/* ═══════════════════════════════════════════════════════════════════
   INIT
   ═══════════════════════════════════════════════════════════════════ */
function init() {
  // Cek sesi aktif → langsung buka aplikasi
  const role = readSession();
  if (role) {
    // Sembunyikan login awal tanpa flash
    document.body.classList.add('app-active');
    // Buka app
    setTimeout(() => openApp(role), 60);
    return;
  }

  // Tidak ada sesi → tampilkan login
  document.body.classList.remove('booting');

  $$('.role-btn').forEach(b => {
    b.addEventListener('click', () => selectRole(b.dataset.role));
    attachRipple(b);
  });

  const input = $('#passwordInput');
  input.addEventListener('input', clearError);
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !$('#btnSubmit').disabled) {
      e.preventDefault();
      handleSubmit();
    }
  });

  $('#togglePass').addEventListener('click', () => {
    state.showPass = !state.showPass;
    input.type = state.showPass ? 'text' : 'password';
    $('#togglePass').innerHTML = state.showPass
      ? '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/><path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/><path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/><line x1="2" x2="22" y1="2" y2="22"/></svg>'
      : '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>';
    try { input.focus(); } catch (_) {}
  });

  const btn = $('#btnSubmit');
  btn.addEventListener('click', handleSubmit);
  attachRipple(btn);

  // Hotkey: 1 = pembeli, 2 = kasir
  document.addEventListener('keydown', (e) => {
    if (e.target.tagName === 'INPUT') return;
    if (state.appOpened) return;
    if (e.key === '1') selectRole('pembeli');
    else if (e.key === '2') selectRole('kasir');
  });

  // Logout FAB
  $('#logoutFab').addEventListener('click', doLogout);
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', init, { once: true });
} else init();
})();
</script>
